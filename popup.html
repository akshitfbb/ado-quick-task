<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADO Quick Task</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1>Quick Task</h1>
          <p class="sub">Child AWS Effort</p>
        </div>
        <button id="options" type="button" class="text-btn">Settings</button>
      </header>

      <p id="status" class="status" role="status">Looking up this work item…</p>

      <section id="parent" class="field" hidden>
        <span class="label">Parent work item</span>
        <p id="parent-title" class="value heading"></p>
        <p id="parent-meta" class="value note"></p>
      </section>

      <form id="form" hidden>
        <div class="field">
          <span class="label">Task title</span>
          <p id="task-title" class="value readonly"></p>
        </div>

        <label class="field" for="effort">
          <span class="label">Effort (hours)</span>
          <span class="input-wrap">
            <input
              id="effort"
              type="number"
              min="0"
              step="any"
              required
              placeholder="0"
              inputmode="decimal"
            />
            <span class="suffix">hrs</span>
          </span>
        </label>

        <button id="submit" type="submit">Create child task</button>
      </form>

      <p id="created" class="created" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
